      <span class="popup-badge" style="background:${color}">${siteLabel}</span>
      <div class="popup-title">${m.title}</div>
      <div class="popup-price" style="color:${color}">${m.price_fmt}${ppm2}</div>
      <div class="popup-sub">${details}${m.ville ? ' · ' + m.ville : ''}</div>
      <a href="${m.url}" target="_blank" class="popup-btn" style="background:${color}">
        Voir l'annonce →
      </a>
    </div>`;

  let marker;
  if (m.precise) {
    const icon = L.divIcon({
      html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;
                          border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
      iconSize: [18, 18], iconAnchor: [9, 9], className: ''
    });
    marker = L.marker([m.lat, m.lon], {icon});
  } else {
    marker = L.circle([m.lat, m.lon], {
      radius: 800, color: color, fillColor: color,
      fillOpacity: 0.25, weight: 2
    });
  }

  marker.bindPopup(popup, {maxWidth: 240}).addTo(map);
  bounds.push([m.lat, m.lon]);
});

if (bounds.length > 0) {
  map.fitBounds(bounds, {padding: [40, 40]});
} else {
  map.setView([48.86, 2.35], 12);
}
</script>
</body>
</html>
